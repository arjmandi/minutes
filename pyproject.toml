[project]
name = "minutes"
version = "0.1.0"
description = "Meeting note-taker: captures, transcribes (Soniox) and translates (LLM) Teams/Meet meetings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "websockets>=13.1",
    "pyjwt>=2.9",
    "anthropic>=0.40",
]

# Application layout (run from repo root), not a distributable package.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic-generated revisions are machine-written; don't hold them to hand-code style.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
