<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>minutes — extension settings</title>
<style>
  :root {
    --ink: #1b1a17; --paper: #f4f2ec; --bg: #faf8f2; --accent: #dd5a1a; --muted: #97948a;
    --border: #e3e0d8; --surface: #fff; --ink2: #5a5750;
    --ok: #2e7d52; --ok-bg: #e7f1ea; --warn: #9a6a00; --warn-bg: #f7efdc; --err: #c0392b; --err-bg: #f6e3e0;
  }
  * { box-sizing: border-box; }
  body { font: 14px "Space Grotesk", system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 24px; }
  .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .hd .logo { width: 28px; height: 28px; border-radius: 7px; }
  .hd b { font-size: 18px; letter-spacing: -0.02em; }
  .hd span { font-size: 14px; color: var(--ink2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .field { display: flex; gap: 8px; }
  input { flex: 1; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; background: var(--surface); color: var(--ink); }
  input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-top: 14px; }
  .chip b { font-weight: 700; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.err { background: var(--err-bg); color: var(--err); }
  .foot { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hd">
      <svg class="logo" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#1B1A17"/><rect x="16" y="20" width="32" height="6" rx="3" fill="#DD5A1A"/><rect x="16" y="29" width="22" height="6" rx="3" fill="#F4F2EC"/><rect x="16" y="38" width="28" height="6" rx="3" fill="#97948A"/></svg>
      <b>minutes</b><span>· extension settings</span>
    </div>
    <div class="card">
      <label for="server">Server URL</label>
      <div class="field">
        <input id="server" placeholder="https://minutes.your-company.com" />
        <button class="ghost" id="test">Test connection</button>
        <button class="primary" id="save">Save</button>
      </div>
      <div class="hint">Point this at your own minutes instance — a domain (https://…) or <code>http://IP:8000</code>. You sign in from the toolbar popup.</div>
      <div id="result"></div>
    </div>
    <div class="foot">Audio is captured in the active tab and streamed only to the server above. Nothing is sent anywhere else.</div>
  </div>
  <script src="options.js"></script>
</body>
</html>
