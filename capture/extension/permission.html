<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>minutes — microphone setup</title>
<style>
  :root {
    --ink: #1b1a17; --paper: #f4f2ec; --bg: #faf8f2; --accent: #dd5a1a; --muted: #97948a;
    --border: #e3e0d8; --surface: #fff; --surface2: #f4f2ec; --surface3: #efece4; --ink2: #5a5750;
    --ok: #2f7d4f; --rec: #c0392b; --danger-soft: #fbeae8;
    --warn: #b45309; --warn-soft: #fbf0e0;
    --src-mic: #2563eb; --src-mic-soft: #e5edfd;
  }
  * { box-sizing: border-box; }
  body { font: 14px "Space Grotesk", system-ui, sans-serif; margin: 0; height: 100vh; background: var(--bg); color: var(--ink); }
  .perm { height: 100%; display: flex; flex-direction: column; }
  .perm__bar { height: 48px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .perm__bar b { font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
  .perm__bar .tag { margin-left: 2px; font-size: 13px; color: var(--ink2); }
  .perm__body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px; min-height: 0; }
  .perm__card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 2px 4px rgba(27,26,23,.05), 0 12px 32px rgba(27,26,23,.07); }
  .perm__ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 18px; }
  .perm__ic--mic { background: var(--src-mic-soft); color: var(--src-mic); }
  .perm__ic--warn { background: var(--warn-soft); color: var(--warn); }
  h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--ink2); line-height: 1.5; margin: 0 0 20px; }
  code { font-family: "Geist Mono", ui-monospace, monospace; font-size: .88em; background: var(--surface3); padding: 1px 6px; border-radius: 5px; color: var(--ink); }
  .fs-label { display: block; font-weight: 600; font-size: 13px; margin: 0; }
  .fs-select { width: 100%; padding: 10px 11px; border: 1px solid var(--border); border-radius: 9px; font: inherit; background: var(--surface); color: var(--ink); }
  .fs-select:disabled { opacity: .6; }
  .fs-btn { font: inherit; font-weight: 600; border: 1px solid var(--border); border-radius: 9px; padding: 10px 16px; cursor: pointer; background: var(--surface); color: var(--ink); }
  .fs-btn--primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fs-btn--lg { padding: 12px 16px; font-size: 15px; width: 100%; }
  .src-mark { width: 9px; height: 9px; border-radius: 3px; flex: none; display: inline-block; vertical-align: middle; }
  .src-mark--mic { background: var(--src-mic); }
  /* toggle switch */
  .fs-switch { display: inline-flex; align-items: center; cursor: pointer; flex: none; }
  .fs-switch__track { width: 38px; height: 22px; border-radius: 999px; background: #cfccc4; position: relative; transition: background .16s ease; }
  .fs-switch__thumb { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .16s ease; }
  .fs-switch.is-on .fs-switch__track { background: var(--accent); }
  .fs-switch.is-on .fs-switch__thumb { left: 18px; }
  /* fields */
  .perm-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .perm-toggle-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--border); }
  .perm-toggle-row__t { font-size: 14px; font-weight: 600; }
  .perm-toggle-row__d { font-size: 12px; color: var(--ink2); margin-top: 3px; max-width: 38ch; line-height: 1.45; }
  .perm__actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .perm__actions .fs-btn { flex: 1; }
  /* live level meter (16 horizontal bars) */
  .lvl-wrap { display: flex; flex-direction: column; gap: 7px; padding: 13px 14px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface2); }
  .lvl { display: flex; align-items: flex-end; gap: 3px; height: 30px; padding: 0 2px; }
  .lvl i { flex: 1; border-radius: 2px; background: var(--src-mic); height: 8%; opacity: .18; transition: height 70ms linear, opacity 70ms linear; }
  .lvl i.is-on { opacity: 1; }
  .lvl-wrap__cap { display: flex; align-items: center; justify-content: space-between; font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: var(--muted); }
  .steps { border: 1px solid var(--border); border-radius: 9px; background: var(--surface2); padding: 14px 16px; margin-bottom: 18px; font-size: 13px; color: var(--ink2); line-height: 1.8; }
  .err { color: var(--rec); font-size: 13px; margin-top: 10px; }
  .center-note { font-size: 12px; color: var(--muted); margin: 14px 0 0; text-align: center; }
  .row { display: flex; gap: 10px; }
  .row .fs-btn { flex: 1; }
</style>
</head>
<body>
  <div class="perm">
    <div class="perm__bar">
      <svg width="22" height="22" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#1B1A17"/><rect x="16" y="20" width="32" height="6" rx="3" fill="#DD5A1A"/><rect x="16" y="29" width="22" height="6" rx="3" fill="#F4F2EC"/><rect x="16" y="38" width="28" height="6" rx="3" fill="#97948A"/></svg>
      <b>minutes</b><span class="tag">· microphone setup</span>
    </div>
    <div class="perm__body"><div class="perm__card" id="card"></div></div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
