<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --ink: #1b1a17; --paper: #f4f2ec; --accent: #dd5a1a; --muted: #97948a;
    --border: #e3e0d8; --surface: #fff; --ink2: #5a5750;
  }
  * { box-sizing: border-box; }
  body { font: 13px "Space Grotesk", system-ui, sans-serif; width: 320px; margin: 0; background: var(--paper); color: var(--ink); }
  .hd { display: flex; align-items: center; gap: 9px; padding: 13px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .hd b { font-size: 15px; letter-spacing: -0.02em; }
  .hd .who { flex: 1; text-align: right; font-family: "Geist Mono", ui-monospace, monospace; font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .logo { width: 24px; height: 24px; border-radius: 6px; flex: none; }
  .body { padding: 14px 16px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 12px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; background: var(--surface); color: var(--ink); }
  input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .primary { background: var(--accent); color: #fff; width: 100%; }
  .ghost { background: transparent; color: var(--ink2); }
  .danger { background: transparent; color: #c0392b; }
  .stop { background: #1b1a17; color: #fff; width: 100%; }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .meeting { font-family: "Geist Mono", ui-monospace, monospace; font-size: 11px; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .meter { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .meter i { width: 5px; border-radius: 3px; background: var(--border); height: 6px; }
  .meter.on i { background: var(--accent); }
  .meter.on i:nth-child(1){height:40%;animation:eq .9s ease-in-out infinite}
  .meter.on i:nth-child(2){height:80%;animation:eq .9s ease-in-out -.15s infinite}
  .meter.on i:nth-child(3){height:100%;animation:eq .9s ease-in-out -.3s infinite}
  .meter.on i:nth-child(4){height:60%;animation:eq .9s ease-in-out -.45s infinite}
  .meter.on i:nth-child(5){height:85%;animation:eq .9s ease-in-out -.6s infinite}
  .meter.on i:nth-child(6){height:50%;animation:eq .9s ease-in-out -.75s infinite}
  .meter.on i:nth-child(7){height:70%;animation:eq .9s ease-in-out -.9s infinite}
  @keyframes eq { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c0392b; display: inline-block; animation: blink 1.2s steps(2,end) infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  #status { margin-top: 12px; font-size: 12px; color: var(--ink2); white-space: pre-wrap; min-height: 1.2em; }
  .err { color: #c0392b; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="hd">
    <svg class="logo" viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#1B1A17"/><rect x="16" y="20" width="32" height="6" rx="3" fill="#DD5A1A"/><rect x="16" y="29" width="22" height="6" rx="3" fill="#F4F2EC"/><rect x="16" y="38" width="28" height="6" rx="3" fill="#97948A"/></svg>
    <b>minutes</b><span class="who" id="who"></span>
  </div>
  <div class="body" id="view"></div>
  <script src="popup.js"></script>
</body>
</html>
