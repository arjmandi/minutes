# Local dev dependencies. Production uses managed Postgres, managed Redis, and S3-compatible object storage.
# MinIO here is a local S3-compatible stand-in for S3-compatible object storage (same S3 protocol).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: minutes
      POSTGRES_PASSWORD: minutes
      POSTGRES_DB: minutes
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minutes"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minutes
      MINIO_ROOT_PASSWORD: minutes-secret
    ports: ["9000:9000", "9001:9001"]
