<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>minutes</title>
<meta name="theme-color" content="#1b1a17" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="minutes" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/assets/fs-styles.css" />
<link rel="stylesheet" href="/assets/app-kit.css" />
<link rel="stylesheet" href="/assets/mobile.css" />
<link rel="stylesheet" href="/assets/dual.css" />
<link rel="stylesheet" href="/assets/recordflow.css" />
<style>
  html, body { height: 100%; margin: 0; }
  #root { height: 100%; }
  /* The app kit sets .m-col__scroll overflow:hidden (artboard); the live app must actually scroll
     long transcripts/lists. min-height:0 lets the flex/grid column shrink so the scroller is bounded. */
  .m-col { min-height: 0; }
  .m-col__scroll { overflow-y: auto; overflow-x: hidden; }
  /* Settings view (rendered into .m-body as a block) also scrolls. */
  #settingswrap { overflow: auto; }
  /* Dual-source: the source selector sets data-src on the transcript/translation columns; lines
     are tagged data-source, so a switch just hides the other source's lines (no re-fetch). */
  [data-src="tab"] .m-line[data-source]:not([data-source="tab"]),
  [data-src="mic"] .m-line[data-source]:not([data-source="mic"]),
  [data-src="upload"] .m-line[data-source]:not([data-source="upload"]) { display: none; }
  #srcbar .fs-segmented__item { display: inline-flex; align-items: center; gap: 7px; }
  /* Two-column public share (dual.css .share2): stack vertically on mobile. */
  @media (max-width: 760px) { .share2--two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root" class="m-app"></div>
<script src="/assets/app.js"></script>
<script>
  // Register the PWA service worker (root scope). Never blocks the app; failures are ignored.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
  }
</script>
</body>
</html>
